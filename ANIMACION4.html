<html>
<head>
    <title>Mega Man Animación</title>
    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
            background-color: black;
        }

    #contenedor{
        width: 1000px;
        height: 200px;
        border: 1px solid black;
        position: relative;
        margin: 0 auto;
        overflow: hidden;
        box-shadow:0 0 150px blue;
    }

    .fondo{
        width: 200%;
        height: 100%;
        background: url("img/fondo.gif") repeat-x;
        background-size: 500px 200px; /* 🔥 AJUSTE DE TAMAÑO */
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;

        animation: moverFondo 4s linear infinite;
    }

    @keyframes moverFondo{
        from{
            transform: translateX(0);
        }
        to{
            transform: translateX(-50%);
        }
    }

    /*MEGAMAN */
    #cuadrito{
        width: 100px;
        height: 120px;
        position: absolute;
        top: 50px;
        left: 100px;
        z-index: 2;

        animation: moverMega 4s linear infinite;
    }

    @keyframes moverMega{
        from{
            left: -200px;
        }
        to{
            left: 1000px;
        }
    }

    #cuadrito img{
        width: 100%;
        height: 110%;
    }
  .volver{
    position:absolute;
    top:25px;
    left:25px;
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:12px 22px;
    border-radius:10px;
    transition:.3s;
}

.volver:hover{
    background:#1d4ed8;
    transform:scale(1.05);
}
    </style>
</head>
<body>
    <a href="index.html" class="volver"> Volver al Portafolio</a><br><br>
    <div id="contenedor">

        <div class="fondo"></div>

        <div id="cuadrito">
            <img src="img/megaman.gif" alt="">
        </div>

    </div>

</body>
</html>
